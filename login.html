<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Lancers Baseball</title>
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css?v=61">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
            background:
                radial-gradient(80% 50% at 100% 0%, rgba(230, 57, 70, 0.22), transparent 60%),
                radial-gradient(80% 50% at 0% 100%, rgba(76, 141, 255, 0.18), transparent 60%),
                var(--bg);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.35s var(--ease) both;
        }
        .login-container .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 1rem;
            display: grid;
            place-items: center;
            font-size: 2.6rem;
            border-radius: 50%;
            background: var(--surface-2);
            box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(230, 57, 70, 0.25);
        }
        .login-container .team-name {
            display: block;
            font-size: 2.3rem;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.75rem; }
        .input-group { position: relative; margin-bottom: 0.75rem; }
        .input-group input { padding-left: 2.9rem; min-height: 52px; }
        .input-group .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.05rem;
            opacity: 0.8;
            pointer-events: none;
        }
        .login-btn {
            width: 100%;
            min-height: 52px;
            margin-top: 0.5rem;
            border: none;
            border-radius: var(--radius-md);
            background: var(--brand);
            color: #fff;
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(230, 57, 70, 0.35);
            transition: var(--transition);
        }
        .login-btn:hover { background: #ef4552; }
        .login-btn:active { transform: scale(0.98); }
        .error-message {
            display: none;
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            background: var(--red-soft);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.9rem;
            animation: shake 0.4s ease;
        }
        .error-message.show { display: block; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .footer-note { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">⚾</div>
        <h1 class="team-name">Lancers Baseball</h1>
        <p class="subtitle">Area riservata ai membri del team</p>
        
        <form id="loginForm">
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="username" placeholder="Username (cognome-numero)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn">⚾ Entra nel Dugout</button>
        </form>
        
        <div class="error-message" id="errorMessage">
            ❌ Username o password errati. Riprova!
        </div>
        
        <p class="footer-note">🏟️ Username: cognome-numero | Password: chiedi allo staff</p>
    </div>

    <script>
        // Database giocatori: username = cognome-numero, password = cognome + prima lettera nome + numero
        const players = [
            { number: 0, name: 'Niccolò', surname: 'Bucci', role: 'UTL', username: 'bucci-0', password: 'buccin0' },
            { number: 1, name: 'Alessandro', surname: 'Ferrini', role: 'P/SS', username: 'ferrini-1', password: 'ferrinia1' },
            { number: 3, name: 'Ettore', surname: 'Della Nave', role: 'OF/P', username: 'dellanave-3', password: 'dellanavee3' },
            { number: 4, name: 'Giovanni G.', surname: 'Beudean', role: 'P/OF', username: 'beudean-4', password: 'beudeang4' },
            { number: 6, name: 'Simone', surname: 'Geri', role: 'OF', username: 'geri-6', password: 'geris6', isStaff: true },
            { number: 7, name: 'Silvano', surname: 'Albano', role: 'OF/IF', username: 'albano-7', password: 'albanos7' },
            { number: 8, name: 'Tommaso', surname: 'Panichi', role: 'OF', username: 'panichi-8', password: 'panichit8' },
            { number: 12, name: 'Francesco', surname: 'Grassi', role: '1B/DH', username: 'grassi-12', password: 'grassif12' },
            { number: 14, name: 'Leonardo', surname: 'Scarpulla', role: 'OF/2B', username: 'scarpulla-14', password: 'scarpullal14' },
            { number: 19, name: 'Simone', surname: 'Baratella', role: '1B/3B', username: 'baratella-19', password: 'baratellas19', isStaff: true },
            { number: 22, name: 'Giuseppe G.', surname: 'Grado', role: 'P', username: 'grado-22', password: 'gradog22' },
            { number: 25, name: 'Lorenzo', surname: 'Scarpulla', role: 'DH/C', username: 'scarpulla-25', password: 'scarpullal25', isStaff: true },
            { number: 32, name: 'Filippo', surname: 'Anichini', role: '3B/SS', username: 'anichini-32', password: 'anichinif32' },
            { number: 38, name: 'Antonio', surname: 'Parrini', role: 'SS/3B', username: 'parrini-38', password: 'parrinia38', isStaff: true },
            { number: 59, name: 'Lapo', surname: 'Biondi', role: '2B/SS', username: 'biondi-59', password: 'biondil59' },
            { number: 89, name: 'Daniele', surname: 'Silvestri', role: 'P', username: 'silvestri-89', password: 'silvestrid89' },
            { number: 90, name: 'Alessandro', surname: 'Rrethatori', role: 'C', username: 'rrethatori-90', password: 'rrethatoria90' },
            { number: 24, name: 'Guido', surname: 'Nannucci', role: 'UTL', username: 'nannucci-24', password: 'nannuccig24' },
            { number: 77, name: 'Cosimo', surname: 'Rinaldi', role: '1B/RF', username: 'rinaldi-77', password: 'rinaldic77' },
            { number: 98, name: 'Federico', surname: 'Paperini', role: 'OF', username: 'paperini-98', password: 'paperinif98' },
            { number: 99, name: 'Vergara', surname: 'Vergara', role: 'C', username: 'vergara-99', password: 'vergarav99' },
            // Admin account
            { number: 'ADMIN', name: 'Admin', surname: 'Staff', role: 'Admin', username: 'admin', password: 'admin26', isStaff: true, isAdmin: true }
        ];

        // Controlla se già autenticato (usa localStorage per persistenza)
        if (localStorage.getItem('authenticated') === 'true') {
            // Ripristina anche in sessionStorage per compatibilità
            sessionStorage.setItem('authenticated', 'true');
            const savedPlayer = localStorage.getItem('playerData');
            if (savedPlayer) {
                sessionStorage.setItem('playerData', savedPlayer);
            }
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.toLowerCase().trim();
            const password = document.getElementById('password').value.toLowerCase().trim();
            const errorMessage = document.getElementById('errorMessage');
            
            // Cerca il giocatore
            const player = players.find(p => p.username === username && p.password === password);
            
            if (player) {
                // Salva in localStorage per persistenza e sessionStorage per compatibilità
                localStorage.setItem('authenticated', 'true');
                localStorage.setItem('playerData', JSON.stringify(player));
                sessionStorage.setItem('authenticated', 'true');
                sessionStorage.setItem('playerData', JSON.stringify(player));
                window.location.href = 'index.html';
            } else {
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
